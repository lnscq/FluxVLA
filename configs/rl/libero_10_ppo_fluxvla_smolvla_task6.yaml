defaults:
  - _smolvla_ppo_base
  - _self_

hydra:
  searchpath:
    - file://${oc.env:RLINF_CONFIG_DIR}

experiment:
  audit_actor: true
  probability_tolerance: 0.0001
  paired_eval_seed: 20260920
  placement:
    actor: 0-3
    rollout: 4-5
    env: 6-7

cluster:
  component_placement: ${experiment.placement}

runner:
  max_epochs: 50
  max_steps: 50
  save_interval: 5
  val_check_interval: 5
  resume_dir: null
  logger:
    project_name: fluxvla-rl-smolvla
    experiment_name: smolvla_libero10_task6_50
    logger_backends: [wandb]

algorithm:
  update_epoch: 2

actor:
  seed: 1234
  micro_batch_size: 2
  global_batch_size: 128
  fsdp_config:
    enable_gradient_accumulation: false

# Keep the PPO settings and normalization of the multi-task run unchanged.
# Each policy sees ONLY task 6; the SFT initialization remains multi-task.
env:
  train:
    seed: 1234
    total_num_envs: 32
    rollout_epoch: 1
    task_id_filter: [6]
  eval:
    seed: 20260920
    task_id_filter: [6]
    total_num_envs: 10
    rollout_epoch: 5
    auto_reset: true
    ignore_terminations: true
    use_ordered_reset_state_ids: true
