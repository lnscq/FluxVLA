defaults:
  - _robotwin_ppo_base
  - _self_

hydra:
  searchpath:
    - file://${oc.env:RLINF_CONFIG_DIR}

runner:
  max_steps: 1
  max_epochs: 1
  val_check_interval: -1
  save_interval: 1
  logger:
    experiment_name: adjust_bottle_integration_gate
    logger_backends: [tensorboard]

# Gate only: one update epoch; official PPO recipe stays at five.
algorithm:
  update_epoch: 1
